<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Felucca 固件的 FM-1 中文学习手册。快速开始、面板操作、音色、录音、多轨、保存与按键速查。" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#ffffff" />
    <title>快速开始 · Felucca 学习手册</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <script src="./src/content.js" defer></script>
    <script src="./src/core.js" defer></script>
    <script src="./src/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳转到正文</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#/quick-start" aria-label="Felucca 学习手册首页">Felucca <span>Docs</span></a>
        <span class="version">v1.6.1</span>
        <button id="open-search" class="search-trigger" type="button" aria-haspopup="dialog">搜索手册 <kbd>Ctrl K</kbd></button>
        <div class="header-actions">
          <a href="https://github.com/hugelton/Felucca" target="_blank" rel="noopener noreferrer">固件源码</a>
          <button id="theme-toggle" class="text-button" type="button" aria-pressed="false">深色模式</button>
        </div>
      </div>
      <nav class="top-nav" aria-label="主导航">
        <div class="top-nav-inner">
          <button id="menu-toggle" class="text-button mobile-menu-toggle" type="button" aria-expanded="false" aria-controls="sidebar">目录</button>
          <a href="#/quick-start" data-tab="manual">学习手册</a>
          <a href="#/shortcuts" data-tab="shortcuts">按键速查</a>
          <a href="#/sources" data-tab="sources">官方资料</a>
          <span class="nav-context">M-VAVE FM-1 · 中文</span>
        </div>
      </nav>
    </header>
    <div id="sidebar-backdrop" hidden></div>
    <div class="docs-layout">
      <aside id="sidebar" class="sidebar" aria-label="章节目录">
        <div class="sidebar-heading">FM-1 / Felucca <button id="close-menu" class="text-button" type="button">关闭</button></div>
        <nav id="chapter-nav" aria-label="学习章节"></nav>
        <div class="sidebar-note">非官方中文手册<br />依据固件 v1.6.1 整理</div>
      </aside>
      <main id="main-content" tabindex="-1">
        <div id="breadcrumb" class="breadcrumb"></div>
        <article id="article"></article>
        <nav id="page-navigation" class="page-navigation" aria-label="相邻章节"></nav>
        <footer class="article-footer">核对日期：2026-10-15 · M-VAVE FM-1 / Felucca v1.6.1</footer>
      </main>
      <aside class="page-outline" aria-label="本页目录">
        <p class="outline-title">本页内容</p>
        <nav id="table-of-contents" aria-label="正文小节"></nav>
        <div class="outline-tools"><button id="print-page" class="text-button" type="button">打印本页</button></div>
      </aside>
    </div>
    <dialog id="search-dialog" aria-labelledby="search-title">
      <div class="search-dialog-header">
        <label id="search-title" for="search-input">搜索手册</label>
        <button id="close-search" class="text-button" type="button">关闭 <kbd>Esc</kbd></button>
      </div>
      <input id="search-input" type="search" placeholder="搜索：保存、REC、音色、没声音…" autocomplete="off" aria-controls="search-results" aria-describedby="search-status" />
      <p id="search-status" class="search-status" role="status" aria-live="polite"></p>
      <div id="search-results" class="search-results"></div>
      <div class="search-help">使用上下方向键选择，回车打开</div>
    </dialog>
    <noscript><p class="noscript-message">请启用 JavaScript 以阅读完整手册与搜索章节。</p></noscript>
  </body>
</html>
